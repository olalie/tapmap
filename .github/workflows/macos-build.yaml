name: macOS Build

on:
  workflow_dispatch:

  push:
    branches:
      - refactor/build-architecture

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tests.txt
          pip install pyinstaller
          brew install create-dmg

      - name: Import signing certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12

          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k runner \
            build.keychain

      - name: Show signing identities
        shell: bash
        run: |
          security find-identity -v -p codesigning                  

      - name: Build (same as local)
        shell: bash
        run: |
          python tools/build.py --sign

      - name: Show build output
        shell: bash
        run: |
          ls -la dist
          ls -la dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tapmap-macos-dmg
          path: dmg/TapMap.dmg
          if-no-files-found: error
          retention-days: 7
