name: Windows Pipeline

on:
  workflow_dispatch:
    inputs:
      sign:
        description: "Submit installer to SignPath"
        type: boolean
        default: false

  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-tests.txt
          pip install pyinstaller

      - name: Build (same as local)
        shell: pwsh
        run: |
          python tools/build.py

      - name: Show build output
        shell: pwsh
        run: |
          Get-ChildItem dist

      - name: Upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: tapmap-windows-setup
          path: dist/TapMap-*-windows-x64-Setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Submit signing request
        if: inputs.sign
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 95d3450c-5444-470c-a16f-9e990aacf813
          project-slug: tapmap
          signing-policy-slug: test-signing
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Show build and signed output
        if: inputs.sign
        shell: pwsh
        run: |
          Write-Host "=== dist ==="
          Get-ChildItem -Recurse dist

          Write-Host ""
          Write-Host "=== signed ==="
          Get-ChildItem -Recurse signed
