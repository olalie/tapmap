name: macOS Pipeline

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: Target architecture
        type: choice
        options:
          - arm64
          - x86_64
        default: arm64
      package:
        description: Create release package
        type: boolean
        default: false

  workflow_call:
    inputs:
      architecture:
        description: Target architecture
        required: true
        type: string
      package:
        description: Create release package
        required: false
        type: boolean
        default: false

env:
  TARGET_ARCH: ${{ inputs.architecture }}

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Select Python interpreter
        shell: bash
        run: |
          if [[ "$TARGET_ARCH" == "x86_64" ]]; then
            echo "PYTHON=arch -x86_64 python" >> "$GITHUB_ENV"
          else
            echo "PYTHON=python" >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        shell: bash
        run: |
          echo "Target architecture: $TARGET_ARCH"
          echo "Using interpreter: $PYTHON"

          $PYTHON --version

          $PYTHON -m pip install --upgrade pip
          $PYTHON -m pip install -r requirements-build.txt

          brew install create-dmg

      - name: Import signing certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12

          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain

          security import certificate.p12 \
            -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k runner \
            build.keychain

      - name: Create notary profile
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials tapmap-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Show signing identities
        shell: bash
        run: |
          security find-identity -v -p codesigning

      - name: Build (same as local)
        shell: bash
        run: |
          echo "Target architecture: $TARGET_ARCH"
          echo "Using interpreter: $PYTHON"

          if [ "${{ inputs.package }}" = "true" ]; then
            $PYTHON tools/build.py --package
          else
            $PYTHON tools/build.py
          fi

      - name: Show build output
        shell: bash
        run: |
          find dist -maxdepth 2

      - name: Upload artifact
        if: inputs.package
        uses: actions/upload-artifact@v7
        with:
          name: tapmap-macos-${{ env.TARGET_ARCH }}
          path: dist/TapMap-*-macos-${{ env.TARGET_ARCH }}.dmg
          if-no-files-found: error
          retention-days: 7
