name: Build Test (Artifacts)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "mkdocs.yaml"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "ARCHITECTURE.md"
      - ".github/workflows/docs.yaml"

jobs:
  build:
    name: Build on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos-arm64
            arch: arm64
          - os: macos-latest
            name: macos-x86_64
            arch: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" && "${{ matrix.arch }}" == "x86_64" ]]; then
            arch -x86_64 python -m pip install --upgrade pip
            arch -x86_64 python -m pip install -r requirements-tests.txt
            arch -x86_64 python -m pip install pyinstaller
          else
            python -m pip install --upgrade pip
            pip install -r requirements-tests.txt
            pip install pyinstaller
          fi

      - name: Run tests
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" && "${{ matrix.arch }}" == "x86_64" ]]; then
            arch -x86_64 python -m pytest -q
          else
            pytest -q
          fi

      - name: Build (same as local)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" && "${{ matrix.arch }}" == "x86_64" ]]; then
            arch -x86_64 python tools/build.py
          else
            python tools/build.py
          fi

      - name: Package artifact
        shell: bash
        env:
          matrix_arch: ${{ matrix.arch }}
        run: |
          python - << 'PY'
          import os
          import zipfile
          from pathlib import Path

          os_name = os.environ["RUNNER_OS"].lower()
          dist = Path("dist")
          exe = dist / ("tapmap.exe" if os_name == "windows" else "tapmap")
          if not exe.exists():
              raise FileNotFoundError(f"Expected build output not found: {exe}")

          arch = os.environ.get("matrix_arch", "")
          suffix = f"-{arch}" if arch else ""
          out = Path(f"tapmap-artifact-{os_name}{suffix}.zip")
          with zipfile.ZipFile(out, "w", compression=zipfile.ZIP_DEFLATED) as zf:
              zf.write(exe, exe.name)

          print(out)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tapmap-${{ matrix.name }}
          path: tapmap-artifact-*.zip
          if-no-files-found: error
          retention-days: 7

  docker-smoke:
    name: Docker smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -t tapmap:test .

      - name: Run version check in container
        run: |
          docker run --rm tapmap:test -v | grep -q "tapmap"

  docker-smoke-arm64:
    name: Docker smoke test arm64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Build arm64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: tapmap:test-arm64

      - name: Run version check in arm64 container
        run: |
          docker run --rm --platform linux/arm64 tapmap:test-arm64 -v | grep -q "tapmap"
