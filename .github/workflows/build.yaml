name: Build

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "mkdocs.yaml"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "PRIVACY.md"
      - "ARCHITECTURE.md"
      - ".github/workflows/docs.yaml"

jobs:
  docker:
    name: Docker Tests
    uses: ./.github/workflows/pipeline-docker.yaml
    with:
      mode: build

  linux:
    name: Linux Build
    uses: ./.github/workflows/pipeline-linux.yaml
    with:
      mode: build

  windows:
    name: Windows Build
    uses: ./.github/workflows/pipeline-windows.yaml
    with:
      mode: build

  macos:
    name: macOS Build
    uses: ./.github/workflows/pipeline-macos.yaml
    with:
      mode: build
    secrets: inherit
