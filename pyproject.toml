[project]
name = "tapmap"
version = "1.10.1"
description = "Watch your computer connect across the internet in real time. Discover the world behind your apps."
requires-python = ">=3.12"
authors = [
    { name = "Ola Lie", email = "ola@tip.no" }
]

[project.scripts]
tapmap = "tapmap.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tapmap = ["assets/*"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = [
  "D100", "D104", "D107",
  "D203", "D213",
  "D401",
]
per-file-ignores = { "tests/*" = ["D101", "D102", "D103"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
pythonpath = ["src"]
