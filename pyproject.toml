[project]
name = "tapmap"
version = "1.5.0"

[project.scripts]
tapmap = "tapmap.app:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = [
  "D100", "D104", "D107",
  "D203", "D213",
  "D401",
]
per-file-ignores = { "tests/*" = ["D101", "D102", "D103"] }

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
